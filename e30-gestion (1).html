<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>E30 | Técnico de celulares</title>
<style>
:root{--blue:#14104C;--bg:#f6f6f8;--line:#e6e6eb;--muted:#70717a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:#17171b}
button,input,select,textarea{font:inherit}button{cursor:pointer}
.app{max-width:1100px;margin:auto;padding:18px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.brand{font-weight:800;color:var(--blue);letter-spacing:-.4px}.sub{font-size:12px;color:var(--muted)}
nav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px}nav button{border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 13px}
nav button.active{background:var(--blue);color:#fff;border-color:var(--blue)}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:14px;box-shadow:0 2px 12px #00000008}
.search{width:100%;font-size:20px;padding:16px 18px;border:1px solid var(--line);border-radius:15px;outline:none}
.search:focus{border-color:#8b87b3;box-shadow:0 0 0 3px #14104c12}
.result,.order{display:flex;justify-content:space-between;gap:15px;align-items:center}.result h3{margin:0 0 4px;font-size:16px}.result p{margin:0;color:var(--muted);font-size:14px}
.price{font-weight:800;color:var(--blue);white-space:nowrap}.btn{border:0;border-radius:11px;padding:10px 13px;background:var(--blue);color:#fff}.btn.secondary{background:#f0f0f4;color:#222}.btn.danger{background:#b42318}
.actions{display:flex;gap:8px;flex-wrap:wrap}label{display:block;font-size:12px;color:var(--muted);margin:0 0 6px}
input,select,textarea{width:100%;border:1px solid var(--line);border-radius:11px;padding:11px;background:#fff;outline:none}
textarea{min-height:80px;resize:vertical}.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.full{grid-column:1/-1}
.badge{display:inline-block;border-radius:999px;padding:5px 9px;font-size:12px;background:#eee}.empty{padding:25px;text-align:center;color:var(--muted)}
@media(max-width:700px){.app{padding:12px}.form{grid-template-columns:1fr}.result,.order{flex-direction:column;align-items:flex-start}.price{align-self:flex-start}}
</style>
</head>
<body>

<div id="loginScreen" class="app" style="max-width:360px">
  <div class="card" style="margin-top:60px">
    <div class="brand" style="font-size:20px;margin-bottom:2px">E30 | Técnico de celulares</div>
    <div class="sub" style="margin-bottom:18px">Acceso privado</div>
    <div id="loginBody">Cargando…</div>
  </div>
</div>

<div class="app" id="appRoot" style="display:none">
<header><div><div class="brand">E30 | Técnico de celulares</div><div class="sub">Gestión de servicio técnico</div></div><div class="sub">Privado</div></header>
<nav>
<button class="active" onclick="show('buscar',this)">🔎 Buscar</button>
<button onclick="show('orden',this)">➕ Nueva orden</button>
<button onclick="show('ordenes',this)">📋 Órdenes</button>
<button onclick="show('precios',this)">💰 Precios</button>
<button onclick="show('presupuestos',this)">🧾 Presupuestos</button>
</nav>

<section id="buscar">
<div class="card"><h2 style="margin-top:0">¿Qué necesitás consultar?</h2><input id="search" class="search" placeholder="Ej.: Moto G31, módulo G31, iPhone 13 pantalla..." oninput="renderSearch()"></div>
<div id="results"></div>
</section>

<section id="orden" style="display:none"><div class="card"><h2 style="margin-top:0">Nueva orden</h2>
<form id="orderForm" class="form">
<div><label>Cliente</label><input id="cliente" required></div><div><label>Teléfono</label><input id="telefono" required></div>
<div><label>Marca</label><input id="marca"></div><div><label>Modelo</label><input id="modelo" required></div>
<div><label>IMEI (opcional)</label><input id="imei"></div>
<div><label>Lugar de recepción</label><select id="local"><option>Demóstenes 3110 — Las Flores</option><option>Piovano 2960 — Moreno</option></select></div>
<div><label>Código / patrón 🔒</label><input id="desbloqueo" type="password" placeholder="Solo vos"><div class="sub" style="margin-top:5px">Dato privado. No se imprime.</div></div>
<div><label>Estado</label><select id="estado"><option>Recibido</option><option>Pendiente</option><option>Esperando repuesto</option><option>En reparación</option><option>Listo</option><option>Entregado</option><option>Cancelado</option></select></div>
<div class="full"><label>Falla / problema</label><textarea id="falla"></textarea></div>
<div class="full"><label>Trabajo a realizar</label><textarea id="trabajo"></textarea></div>
<div><label>Total</label><input id="total" type="number" min="0" value="0"></div><div><label>Seña</label><input id="sena" type="number" min="0" value="0"></div>
<div><label>Forma de pago</label><select id="pago"><option>Sin pago</option><option>Efectivo</option><option>Transferencia</option><option>Mercado Pago</option><option>Tarjeta</option><option>Otro</option></select></div>
<div><label>Entrega estimada</label><input id="entrega" type="date"></div>
<div class="full"><label>Observaciones para el técnico 🔒</label><textarea id="obsTecnico" placeholder="Ej.: limpiar cámaras, revisar tornillos..."></textarea><div class="sub">Dato interno. No se imprime.</div></div>
<div class="full"><label>Observaciones para el cliente</label><textarea id="obs"></textarea></div>
<div class="full actions"><button class="btn" type="submit">Crear orden</button><button class="btn secondary" type="button" onclick="resetOrder()">Limpiar</button></div>
</form></div></section>

<section id="ordenes" style="display:none"><div class="card"><h2 style="margin-top:0">Órdenes</h2><input id="orderSearch" placeholder="Buscar por número, cliente, teléfono o modelo" oninput="renderOrders()"></div><div id="orders"></div></section>

<section id="precios" style="display:none">
<div class="card"><h2 style="margin-top:0">Agregar precio</h2>
<div class="form">
<div><label>Marca</label><input id="npMarca" placeholder="Ej.: iPhone"></div>
<div><label>Modelo</label><input id="npModelo" placeholder="Ej.: 17 Pro"></div>
<div class="full"><label>Reparación</label><input id="npReparacion" placeholder="Ej.: Pantalla"></div>
<div><label>Precio</label><input id="npPrecio" type="number" min="0"></div>
<div class="full"><button class="btn" onclick="addPrice()">+ Agregar precio</button></div>
</div></div>
<div id="prices"></div>
</section>

<section id="presupuestos" style="display:none">
<div class="card"><h2 style="margin-top:0">Nuevo presupuesto</h2>
<form id="budgetForm" class="form">
<div><label>Cliente</label><input id="bCliente" required></div>
<div><label>Teléfono</label><input id="bTelefono"></div>
<div><label>Marca</label><input id="bMarca" required></div>
<div><label>Modelo</label><input id="bModelo" required></div>
<div><label>Sucursal</label><select id="bLocal"><option>Demóstenes 3110 — Las Flores</option><option>Piovano 2960 — Moreno</option></select></div>
<div><label>Precio</label><input id="bPrecio" type="number" min="0" required></div>
<div class="full"><label>Reparación / concepto</label><input id="bConcepto" required placeholder="Ej.: Cambio de pantalla"></div>
<div class="full"><label>Observaciones (opcional)</label><textarea id="bObs"></textarea></div>
<div class="full actions"><button class="btn" type="submit">Crear presupuesto</button><button class="btn secondary" type="button" onclick="resetBudget()">Limpiar</button></div>
</form></div>
<div id="budgets"></div>
</section>
</div>

<script>
/* ============================================================
   BASE DE DATOS PRIVADA (Supabase — misma cuenta que la web
   pública, pero en su PROPIA tabla, separada de esos datos)
   SQL para crear la tabla (correr una sola vez en Supabase):

   create table e30_kv (key text primary key, value jsonb);
   alter table e30_kv enable row level security;
   create policy "public read" on e30_kv for select using (true);
   create policy "public insert" on e30_kv for insert with check (true);
   create policy "public update" on e30_kv for update using (true) with check (true);
   grant select, insert, update on public.e30_kv to anon;
   ============================================================ */
const SUPABASE_URL="https://edeaijyayhhijyyjksss.supabase.co";
const SUPABASE_KEY="sb_publishable_jIYqZUl28NXA4NCqL3K_uA_nbiQRcPf";
function sbHeaders(extra){return Object.assign({apikey:SUPABASE_KEY,Authorization:"Bearer "+SUPABASE_KEY,"Content-Type":"application/json"},extra||{});}
async function kvGet(key){
  const res=await fetch(`${SUPABASE_URL}/rest/v1/e30_kv?key=eq.${encodeURIComponent(key)}&select=value`,{headers:sbHeaders()});
  if(!res.ok) throw new Error("read failed "+res.status);
  const rows=await res.json();
  return (rows&&rows[0])?rows[0].value:null;
}
async function kvSet(key,value){
  await fetch(`${SUPABASE_URL}/rest/v1/e30_kv`,{method:"POST",headers:sbHeaders({Prefer:"resolution=merge-duplicates"}),body:JSON.stringify([{key,value}])});
}
async function sha256Hex(str){const buf=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(str));return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,"0")).join("");}

const DEFAULT_PRICES=[
{id:1,marca:"iPhone",modelo:"11",reparacion:"Pantalla",precio:110000,activo:true},
{id:2,marca:"iPhone",modelo:"11 Pro",reparacion:"Pantalla",precio:230000,activo:true},
{id:3,marca:"iPhone",modelo:"11 Pro Max",reparacion:"Pantalla",precio:230000,activo:true},
{id:4,marca:"iPhone",modelo:"12",reparacion:"Pantalla",precio:250000,activo:true},
{id:5,marca:"iPhone",modelo:"12 Pro",reparacion:"Pantalla",precio:250000,activo:true},
{id:6,marca:"iPhone",modelo:"12 Pro Max",reparacion:"Pantalla",precio:270000,activo:true},
{id:7,marca:"iPhone",modelo:"13",reparacion:"Pantalla",precio:250000,activo:true},
{id:8,marca:"iPhone",modelo:"13 Pro",reparacion:"Pantalla",precio:280000,activo:true},
{id:9,marca:"iPhone",modelo:"13 Pro Max",reparacion:"Pantalla",precio:280000,activo:true},
{id:10,marca:"iPhone",modelo:"14",reparacion:"Pantalla",precio:265000,activo:true},
{id:11,marca:"iPhone",modelo:"14 Pro",reparacion:"Pantalla",precio:350000,activo:true},
{id:12,marca:"iPhone",modelo:"14 Pro Max",reparacion:"Pantalla",precio:330000,activo:true},
{id:13,marca:"iPhone",modelo:"15",reparacion:"Pantalla",precio:280000,activo:true},
{id:14,marca:"iPhone",modelo:"15 Pro",reparacion:"Pantalla",precio:420000,activo:true},
{id:15,marca:"iPhone",modelo:"15 Pro Max",reparacion:"Pantalla",precio:455000,activo:true},
{id:16,marca:"iPhone",modelo:"16",reparacion:"Pantalla",precio:300000,activo:true},
{id:17,marca:"iPhone",modelo:"16 Pro",reparacion:"Pantalla",precio:503000,activo:true},
{id:18,marca:"iPhone",modelo:"16 Pro Max",reparacion:"Pantalla",precio:598000,activo:true},
{id:19,marca:"iPhone",modelo:"11",reparacion:"Batería premium sin cartel",precio:105000,activo:true},
{id:20,marca:"iPhone",modelo:"11",reparacion:"Batería premium con cartel",precio:80000,activo:true},
{id:21,marca:"iPhone",modelo:"11",reparacion:"Cámara trasera",precio:90000,activo:true},
{id:22,marca:"iPhone",modelo:"11",reparacion:"Actualización de software",precio:30000,activo:true},
{id:23,marca:"iPhone",modelo:"11",reparacion:"Auricular",precio:80000,activo:true},
{id:24,marca:"iPhone",modelo:"11",reparacion:"Botón de encendido",precio:90000,activo:true},
{id:25,marca:"iPhone",modelo:"11",reparacion:"Botón de volumen",precio:90000,activo:true},
{id:26,marca:"iPhone",modelo:"11",reparacion:"Carga inalámbrica",precio:85000,activo:true},
{id:27,marca:"iPhone",modelo:"11",reparacion:"Cristal trasero de cámara",precio:40000,activo:true},
{id:28,marca:"iPhone",modelo:"11",reparacion:"Cristal trasero/tapa",precio:95000,activo:true},
{id:29,marca:"iPhone",modelo:"11",reparacion:"Chasis completo",precio:110000,activo:true},
{id:30,marca:"Motorola",modelo:"G31",reparacion:"Módulo",precio:60000,activo:true}
];

let prices=[],orders=[],budgets=[],passHash=null,authed=false;
const money=n=>new Intl.NumberFormat("es-AR",{style:"currency",currency:"ARS",maximumFractionDigits:0}).format(n||0);

async function loadAll(attempt){
  attempt=attempt||1;
  try{
    const [p,o,b,ph]=await Promise.all([kvGet("e30-prices"),kvGet("e30-orders"),kvGet("e30-budgets"),kvGet("e30-pass")]);
    prices=(p&&p.length)?p:JSON.parse(JSON.stringify(DEFAULT_PRICES));
    orders=o||[];
    budgets=b||[];
    passHash=ph;
  }catch(e){
    if(attempt<3){await new Promise(r=>setTimeout(r,1200));return loadAll(attempt+1);}
    document.getElementById("loginBody").innerHTML='<div class="sub">No se pudo conectar con la base de datos. Revisá tu conexión y recargá la página.</div>';
    throw e;
  }
}
function saveOrders(){kvSet("e30-orders",orders);}
function saveBudgets(){kvSet("e30-budgets",budgets);}
function savePrices(){kvSet("e30-prices",prices);}

function renderLogin(){
  const body=document.getElementById("loginBody");
  if(!passHash){
    body.innerHTML=`<div class="sub" style="margin-bottom:10px">Todavía no configuraste una contraseña. Creála ahora.</div>
      <div style="margin-bottom:10px"><label>Nueva contraseña</label><input id="setupPass" type="password"></div>
      <div style="margin-bottom:10px"><label>Repetir</label><input id="setupPass2" type="password"></div>
      <button class="btn" style="width:100%" onclick="setupPassword()">Crear y entrar</button>`;
  }else{
    body.innerHTML=`<div style="margin-bottom:10px"><label>Contraseña</label><input id="loginPass" type="password" onkeydown="if(event.key==='Enter')doLogin()"></div>
      <button class="btn" style="width:100%" onclick="doLogin()">Entrar</button>
      <div id="loginError" style="color:#b42318;font-size:13px;margin-top:8px"></div>`;
  }
}
async function setupPassword(){
  const p1=document.getElementById("setupPass").value,p2=document.getElementById("setupPass2").value;
  if(p1.length<4){alert("Usá al menos 4 caracteres.");return;}
  if(p1!==p2){alert("Las contraseñas no coinciden.");return;}
  passHash=await sha256Hex(p1);await kvSet("e30-pass",passHash);enterApp();
}
async function doLogin(){
  const p=document.getElementById("loginPass").value;
  if(await sha256Hex(p)===passHash) enterApp();
  else document.getElementById("loginError").textContent="Contraseña incorrecta.";
}
function enterApp(){
  authed=true;
  document.getElementById("loginScreen").style.display="none";
  document.getElementById("appRoot").style.display="block";
  renderSearch();
}
(async function init(){
  await loadAll();
  renderLogin();
})();

function show(id,btn){document.querySelectorAll("section").forEach(x=>x.style.display="none");document.getElementById(id).style.display="block";document.querySelectorAll("nav button").forEach(x=>x.classList.remove("active"));if(btn)btn.classList.add("active");if(id==="ordenes")renderOrders();if(id==="precios")renderPrices();if(id==="presupuestos")renderBudgets();}

function renderSearch(){const q=document.getElementById("search").value.toLowerCase().trim();const words=q.split(/\s+/).filter(Boolean);const data=prices.filter(p=>p.activo!==false).filter(p=>{const t=`${p.marca} ${p.modelo} ${p.reparacion}`.toLowerCase();return words.every(w=>t.includes(w));});document.getElementById("results").innerHTML=data.map(p=>`<div class="card result"><div><h3>${p.marca} ${p.modelo}</h3><p>${p.reparacion}</p></div><div><div class="price">${money(p.precio)}</div><button class="btn" onclick="newFromPrice(${p.id})">+ Crear orden</button></div></div>`).join("")||'<div class="card empty">No encontré ese precio.</div>';}
function newFromPrice(id){const p=prices.find(x=>x.id===id);show("orden");marca.value=p.marca;modelo.value=p.modelo;trabajo.value=p.reparacion;total.value=p.precio;}

document.getElementById("orderForm").onsubmit=e=>{
e.preventDefault();const n=(orders.length?Math.max(...orders.map(o=>o.n)):0)+1;
const o={n,cliente:cliente.value,telefono:telefono.value,marca:marca.value,modelo:modelo.value,imei:imei.value,local:local.value,desbloqueo:desbloqueo.value,estado:estado.value,falla:falla.value,trabajo:trabajo.value,total:+total.value||0,sena:+sena.value||0,pago:pago.value,entrega:entrega.value,obsTecnico:obsTecnico.value,obs:obs.value,fecha:new Date().toLocaleDateString("es-AR")};
orders.unshift(o);saveOrders();resetOrder();show("ordenes");document.querySelectorAll("nav button")[2].classList.add("active");renderOrders();
};
function resetOrder(){document.getElementById("orderForm").reset();total.value=0;sena.value=0;}

function orderCard(o){return `<div class="card"><div class="order"><div><b>#${String(o.n).padStart(4,"0")}</b><h3>${o.cliente}</h3><div>${o.marca} ${o.modelo} · ${o.trabajo||"Sin trabajo indicado"}</div><div class="sub">${o.local} · ${o.telefono} · Ingreso ${o.fecha}</div>
<div class="sub" style="margin-top:5px">🔒 Código/patrón: <button class="btn secondary" style="padding:4px 8px;font-size:11px" onclick="toggleUnlock(${o.n},this)">Mostrar</button> <span id="unlock-${o.n}" style="display:none;font-weight:600"></span></div>
<div class="sub" style="margin-top:5px">🛠️ Obs. técnico: <button class="btn secondary" style="padding:4px 8px;font-size:11px" onclick="toggleTechObs(${o.n},this)">Mostrar</button> <span id="techobs-${o.n}" style="display:none;font-weight:600"></span></div>
</div><div><select onchange="setStatus(${o.n},this.value)" style="width:auto;padding:6px 8px;font-size:12px;border-radius:8px">${ESTADOS.map(s=>`<option ${o.estado===s?"selected":""}>${s}</option>`).join("")}</select><div class="price">${money(o.total)}</div></div></div><hr>
<div><b>Seña:</b> ${money(o.sena)} · <b>Saldo:</b> ${money(Math.max(0,o.total-o.sena))}</div>
<div class="actions" style="margin-top:12px"><button class="btn" onclick="printTicket(${o.n})">🖨️ Imprimir ticket</button><button class="btn danger" onclick="deleteOrder(${o.n})">Eliminar</button></div></div>`}
function renderOrders(){const q=(document.getElementById("orderSearch")?.value||"").toLowerCase();const arr=orders.filter(o=>JSON.stringify(o).toLowerCase().includes(q));document.getElementById("orders").innerHTML=arr.map(orderCard).join("")||'<div class="card empty">No hay órdenes.</div>';}
const ESTADOS=["Recibido","Pendiente","Esperando repuesto","En reparación","Listo","Entregado","Cancelado"];
function setStatus(n,val){const o=orders.find(x=>x.n===n);o.estado=val;saveOrders();}
function deleteOrder(n){if(confirm("¿Eliminar la orden?")){orders=orders.filter(o=>o.n!==n);saveOrders();renderOrders();}}
function toggleUnlock(n,b){const o=orders.find(x=>x.n===n),el=document.getElementById("unlock-"+n);if(el.style.display==="none"){el.textContent=o.desbloqueo||"No informado";el.style.display="inline";b.textContent="Ocultar"}else{el.style.display="none";b.textContent="Mostrar"}}
function toggleTechObs(n,b){const o=orders.find(x=>x.n===n),el=document.getElementById("techobs-"+n);if(el.style.display==="none"){el.textContent=o.obsTecnico||"Sin observaciones";el.style.display="inline";b.textContent="Ocultar"}else{el.style.display="none";b.textContent="Mostrar"}}
function renderPrices(){
  document.getElementById("prices").innerHTML=prices.map(p=>`<div class="card" id="price-${p.id}">
    <div class="order"><div><b>${p.marca} ${p.modelo}</b><div class="sub">${p.reparacion}${p.activo===false?" · (desactivado)":""}</div></div>
    <div><div class="price">${money(p.precio)}</div></div></div>
    <div class="actions" style="margin-top:10px">
      <button class="btn secondary" onclick="editPrice(${p.id})">Editar</button>
      <button class="btn secondary" onclick="togglePrice(${p.id})">${p.activo===false?"Activar":"Desactivar"}</button>
      <button class="btn danger" onclick="deletePrice(${p.id})">Eliminar</button>
    </div></div>`).join("")||'<div class="card empty">No hay precios cargados.</div>';
}
function addPrice(){
  const maxId=prices.length?Math.max(...prices.map(p=>p.id)):0;
  prices.push({id:maxId+1,marca:document.getElementById("npMarca").value.trim(),modelo:document.getElementById("npModelo").value.trim(),reparacion:document.getElementById("npReparacion").value.trim(),precio:+document.getElementById("npPrecio").value||0,activo:true});
  savePrices();["npMarca","npModelo","npReparacion","npPrecio"].forEach(id=>document.getElementById(id).value="");renderPrices();
}
function editPrice(id){
  const p=prices.find(x=>x.id===id);
  document.getElementById("price-"+id).innerHTML=`<div class="form">
    <div><label>Marca</label><input id="ep-marca-${id}" value="${p.marca}"></div>
    <div><label>Modelo</label><input id="ep-modelo-${id}" value="${p.modelo}"></div>
    <div class="full"><label>Reparación</label><input id="ep-reparacion-${id}" value="${p.reparacion}"></div>
    <div><label>Precio</label><input id="ep-precio-${id}" type="number" value="${p.precio}"></div>
    <div class="full actions"><button class="btn" onclick="savePriceEdit(${id})">Guardar</button><button class="btn secondary" onclick="renderPrices()">Cancelar</button></div>
  </div>`;
}
function savePriceEdit(id){
  const p=prices.find(x=>x.id===id);
  p.marca=document.getElementById("ep-marca-"+id).value.trim();
  p.modelo=document.getElementById("ep-modelo-"+id).value.trim();
  p.reparacion=document.getElementById("ep-reparacion-"+id).value.trim();
  p.precio=+document.getElementById("ep-precio-"+id).value||0;
  savePrices();renderPrices();
}
function togglePrice(id){const p=prices.find(x=>x.id===id);p.activo=p.activo===false?true:false;savePrices();renderPrices();}
function deletePrice(id){if(confirm("¿Eliminar este precio?")){prices=prices.filter(x=>x.id!==id);savePrices();renderPrices();}}

document.getElementById("budgetForm").onsubmit=e=>{
e.preventDefault();
const n=(budgets.length?Math.max(...budgets.map(x=>x.n)):0)+1;
const issued=new Date(), valid=new Date(issued);valid.setDate(valid.getDate()+7);
const o={n,cliente:bCliente.value,telefono:bTelefono.value,marca:bMarca.value,modelo:bModelo.value,local:bLocal.value,precio:+bPrecio.value||0,concepto:bConcepto.value,obs:bObs.value,emitida:issued.toLocaleDateString("es-AR"),valida:valid.toLocaleDateString("es-AR")};
budgets.unshift(o);saveBudgets();resetBudget();renderBudgets();
};
function resetBudget(){document.getElementById("budgetForm").reset();}
function renderBudgets(){document.getElementById("budgets").innerHTML=budgets.map(o=>`<div class="card"><div class="order"><div><b>PRESUPUESTO #${String(o.n).padStart(4,"0")}</b><h3>${o.cliente}</h3><div>${o.marca} ${o.modelo} · ${o.concepto}</div><div class="sub">${o.local} · ${o.telefono||"Sin teléfono"}</div></div><div><div class="price">${money(o.precio)}</div><div class="sub">Válido hasta ${o.valida}</div></div></div><div class="actions" style="margin-top:12px"><button class="btn" onclick="printBudget(${o.n})">🖨️ Imprimir presupuesto</button><button class="btn danger" onclick="deleteBudget(${o.n})">Eliminar</button></div></div>`).join("")||'<div class="card empty">Todavía no hay presupuestos.</div>';}
function deleteBudget(n){if(confirm("¿Eliminar el presupuesto?")){budgets=budgets.filter(x=>x.n!==n);saveBudgets();renderBudgets();}}
