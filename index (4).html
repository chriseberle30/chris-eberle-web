<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Chris Eberle | Control</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js" crossorigin></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #F3F4F6; }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useMemo, useEffect } = React;

const SUPABASE_URL = 'https://yhdvavytnstqsfolxhny.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InloZHZhdnl0bnN0cXNmb2x4aG55Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgzODc1MTYsImV4cCI6MjEwMzk2MzUxNn0.ZO3lLVFKghyvrCsDIuRQMGuwcqLc02GKR4yjOn4UDZY';
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const TIPOS = {
  reparacion: { label: 'Reparación', icon: '🔧', color: '#2F5FFF' },
  venta: { label: 'Venta', icon: '🛍️', color: '#9333EA' },
};

const emptyForm = { cliente: '', tipo: 'reparacion', cobrado: '', repuesto: '' };

function GestorGanancias() {
  const [ingresos, setIngresos] = useState([]);
  const [cargando, setCargando] = useState(true);
  const [editandoId, setEditandoId] = useState(null);
  const [formEdit, setFormEdit] = useState(emptyForm);
  const [mostrarForm, setMostrarForm] = useState(false);
  const [formNuevo, setFormNuevo] = useState(emptyForm);

  const cargarDatos = async () => {
    setCargando(true);
    const { data, error } = await supabase
      .from('trabajos_control')
      .select('*')
      .order('created_at', { ascending: false });
    if (!error && data) setIngresos(data);
    setCargando(false);
  };

  useEffect(() => { cargarDatos(); }, []);

  const ganancia = (item) => Number(item.cobrado || 0) - Number(item.repuesto || 0);

  const totales = useMemo(() => {
    const porTipo = { reparacion: 0, venta: 0 };
    let total = 0;
    ingresos.forEach((it) => {
      const g = ganancia(it);
      total += g;
      porTipo[it.tipo] = (porTipo[it.tipo] || 0) + g;
    });
    return { total, porTipo };
  }, [ingresos]);

  const handleEditar = (item) => {
    setEditandoId(item.id);
    setFormEdit(item);
  };

  const handleGuardarEdit = async (id) => {
    const { error } = await supabase
      .from('trabajos_control')
      .update({
        cliente: formEdit.cliente,
        tipo: formEdit.tipo,
        cobrado: Number(formEdit.cobrado),
        repuesto: Number(formEdit.repuesto),
      })
      .eq('id', id);
    if (!error) {
      setIngresos(ingresos.map((item) => (item.id === id ? { ...formEdit, id } : item)));
    }
    setEditandoId(null);
  };

  const handleEliminar = async (id) => {
    const { error } = await supabase.from('trabajos_control').delete().eq('id', id);
    if (!error) setIngresos(ingresos.filter((item) => item.id !== id));
  };

  const handleAgregar = async () => {
    if (!formNuevo.cliente.trim() || !formNuevo.cobrado) return;
    const nuevo = {
      cliente: formNuevo.cliente.trim(),
      tipo: formNuevo.tipo,
      cobrado: Number(formNuevo.cobrado),
      repuesto: Number(formNuevo.repuesto || 0),
    };
    const { data, error } = await supabase
      .from('trabajos_control')
      .insert(nuevo)
      .select()
      .single();
    if (!error && data) {
      setIngresos([data, ...ingresos]);
      setFormNuevo(emptyForm);
      setMostrarForm(false);
    }
  };

  const fmt = (n) => `$${Number(n).toLocaleString('es-AR')}`;

  if (cargando) {
    return (
      <div style={{ textAlign: 'center', padding: 60, color: '#9BA3B5', fontFamily: 'system-ui, sans-serif' }}>
        Cargando...
      </div>
    );
  }

  return (
    <div style={{ maxWidth: 640, margin: '0 auto', padding: '20px 16px', fontFamily: 'system-ui, -apple-system, sans-serif', color: '#1A1D29' }}>
      <div style={{ background: '#1A1D29', borderRadius: 20, padding: '24px 20px', marginBottom: 16 }}>
        <div style={{ fontSize: 13, color: '#9BA3B5', marginBottom: 4 }}>Ganancia del mes</div>
        <div style={{ fontSize: 36, fontWeight: 700, color: '#4ADE80', letterSpacing: -0.5 }}>{fmt(totales.total)}</div>
        <div style={{ display: 'flex', gap: 20, marginTop: 16, paddingTop: 16, borderTop: '1px solid #2E3244' }}>
          {Object.entries(TIPOS).map(([key, meta]) => (
            <div key={key} style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
              <span style={{ fontSize: 16 }}>{meta.icon}</span>
              <div>
                <div style={{ fontSize: 11, color: '#9BA3B5' }}>{meta.label}</div>
                <div style={{ fontSize: 15, fontWeight: 600, color: '#fff' }}>{fmt(totales.porTipo[key] || 0)}</div>
              </div>
            </div>
          ))}
        </div>
      </div>

      {!mostrarForm ? (
        <button
          onClick={() => setMostrarForm(true)}
          style={{
            width: '100%', display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 8,
            background: '#2F5FFF', color: '#fff', border: 'none', borderRadius: 14,
            padding: '14px 0', fontSize: 15, fontWeight: 600, marginBottom: 20, cursor: 'pointer',
          }}
        >
          + Nuevo trabajo
        </button>
      ) : (
        <div style={{ background: '#fff', border: '1px solid #E5E7EB', borderRadius: 16, padding: 16, marginBottom: 20 }}>
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 12 }}>
            <span style={{ fontSize: 14, fontWeight: 600 }}>Nuevo trabajo</span>
            <button onClick={() => { setMostrarForm(false); setFormNuevo(emptyForm); }} style={{ background: 'none', border: 'none', cursor: 'pointer', fontSize: 16, color: '#9BA3B5' }}>✕</button>
          </div>

          <div style={{ display: 'flex', gap: 8, marginBottom: 10 }}>
            {Object.entries(TIPOS).map(([key, meta]) => (
              <button
                key={key}
                onClick={() => setFormNuevo({ ...formNuevo, tipo: key })}
                style={{
                  flex: 1, display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 6,
                  padding: '8px 0', borderRadius: 10, fontSize: 13, fontWeight: 600, cursor: 'pointer',
                  border: formNuevo.tipo === key ? `1.5px solid ${meta.color}` : '1.5px solid #E5E7EB',
                  background: formNuevo.tipo === key ? `${meta.color}15` : '#fff',
                  color: formNuevo.tipo === key ? meta.color : '#6B7280',
                }}
              >
                <span>{meta.icon}</span> {meta.label}
              </button>
            ))}
          </div>

          <input
            placeholder="Cliente / trabajo"
            value={formNuevo.cliente}
            onChange={(e) => setFormNuevo({ ...formNuevo, cliente: e.target.value })}
            style={inputStyle}
          />
          <div style={{ display: 'flex', gap: 8, marginTop: 8 }}>
            <input
              type="number"
              placeholder="Cobrado ($)"
              value={formNuevo.cobrado}
              onChange={(e) => setFormNuevo({ ...formNuevo, cobrado: e.target.value })}
              style={{ ...inputStyle, flex: 1 }}
            />
            <input
              type="number"
              placeholder="Costo repuesto ($)"
              value={formNuevo.repuesto}
              onChange={(e) => setFormNuevo({ ...formNuevo, repuesto: e.target.value })}
              style={{ ...inputStyle, flex: 1 }}
            />
          </div>
          <button
            onClick={handleAgregar}
            style={{
              width: '100%', marginTop: 12, background: '#1A1D29', color: '#fff', border: 'none',
              borderRadius: 10, padding: '10px 0', fontSize: 14, fontWeight: 600, cursor: 'pointer',
            }}
          >
            Guardar
          </button>
        </div>
      )}

      <div style={{ fontSize: 12, fontWeight: 600, color: '#9BA3B5', marginBottom: 8, letterSpacing: 0.3 }}>
        Trabajos registrados
      </div>
      <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
        {ingresos.length === 0 && (
          <div style={{ textAlign: 'center', color: '#9BA3B5', fontSize: 14, padding: '24px 0' }}>
            Todavía no cargaste ningún trabajo.
          </div>
        )}
        {ingresos.map((item) => {
          const esEditando = editandoId === item.id;
          const meta = TIPOS[item.tipo] || TIPOS.reparacion;
          const g = esEditando ? Number(formEdit.cobrado || 0) - Number(formEdit.repuesto || 0) : ganancia(item);

          return (
            <div key={item.id} style={{ background: '#fff', border: '1px solid #E5E7EB', borderRadius: 14, padding: 14 }}>
              {esEditando ? (
                <div>
                  <div style={{ display: 'flex', gap: 8, marginBottom: 8 }}>
                    {Object.entries(TIPOS).map(([key, m]) => (
                      <button
                        key={key}
                        onClick={() => setFormEdit({ ...formEdit, tipo: key })}
                        style={{
                          flex: 1, padding: '6px 0', borderRadius: 8, fontSize: 12, fontWeight: 600, cursor: 'pointer',
                          border: formEdit.tipo === key ? `1.5px solid ${m.color}` : '1.5px solid #E5E7EB',
                          background: formEdit.tipo === key ? `${m.color}15` : '#fff',
                          color: formEdit.tipo === key ? m.color : '#6B7280',
                        }}
                      >
                        {m.label}
                      </button>
                    ))}
                  </div>
                  <input value={formEdit.cliente} onChange={(e) => setFormEdit({ ...formEdit, cliente: e.target.value })} style={inputStyle} />
                  <div style={{ display: 'flex', gap: 8, marginTop: 8 }}>
                    <input type="number" value={formEdit.cobrado} onChange={(e) => setFormEdit({ ...formEdit, cobrado: Number(e.target.value) })} style={{ ...inputStyle, flex: 1 }} />
                    <input type="number" value={formEdit.repuesto} onChange={(e) => setFormEdit({ ...formEdit, repuesto: Number(e.target.value) })} style={{ ...inputStyle, flex: 1 }} />
                  </div>
                  <button
                    onClick={() => handleGuardarEdit(item.id)}
                    style={{ marginTop: 10, display: 'flex', alignItems: 'center', gap: 6, background: '#16A34A', color: '#fff', border: 'none', borderRadius: 10, padding: '8px 14px', fontSize: 13, fontWeight: 600, cursor: 'pointer' }}
                  >
                    ✓ Guardar
                  </button>
                </div>
              ) : (
                <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
                  <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
                    <div style={{ width: 34, height: 34, borderRadius: 10, background: `${meta.color}15`, display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0, fontSize: 16 }}>
                      {meta.icon}
                    </div>
                    <div>
                      <div style={{ fontSize: 14, fontWeight: 600 }}>{item.cliente}</div>
                      <div style={{ fontSize: 12, color: '#9BA3B5' }}>Cobrado {fmt(item.cobrado)} · Repuesto {fmt(item.repuesto)}</div>
                    </div>
                  </div>
                  <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
                    <div style={{ fontSize: 15, fontWeight: 700, color: g >= 0 ? '#16A34A' : '#DC2626' }}>{fmt(g)}</div>
                    <button onClick={() => handleEditar(item)} style={iconBtnStyle}>✏️</button>
                    <button onClick={() => handleEliminar(item.id)} style={iconBtnStyle}>🗑️</button>
                  </div>
                </div>
              )}
            </div>
          );
        })}
      </div>
    </div>
  );
}

const inputStyle = {
  width: '100%', boxSizing: 'border-box', border: '1px solid #E5E7EB', borderRadius: 10,
  padding: '9px 12px', fontSize: 14, outline: 'none',
};

const iconBtnStyle = {
  background: '#F3F4F6', border: 'none', borderRadius: 8, width: 28, height: 28,
  display: 'flex', alignItems: 'center', justifyContent: 'center', cursor: 'pointer', fontSize: 13,
};

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<GestorGanancias />);
</script>
</body>
</html>
