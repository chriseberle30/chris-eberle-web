<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#020426"><title>Seguimiento de reparación · E30</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f5f9;color:#182230;font:15px system-ui,-apple-system,sans-serif;min-height:100vh;display:grid;place-items:center;padding:20px}.card{width:min(520px,100%);background:#fff;border:1px solid #e4e8ef;border-radius:20px;padding:26px;box-shadow:0 18px 60px #10182812}.brand{font-weight:900;letter-spacing:.08em;color:#020426;font-size:18px}.eyebrow{font-size:10px;letter-spacing:.14em;color:#667085;font-weight:800;margin:24px 0 8px}.title{font-size:25px;line-height:1.15;margin:0}.sub{color:#667085;font-size:13px;margin:8px 0 22px}.status{padding:15px;border-radius:12px;background:#edf3ff;color:#1e429f;font-weight:800;font-size:17px}.meta{display:flex;justify-content:space-between;gap:15px;padding:13px 0;border-bottom:1px solid #edf0f4;font-size:13px}.meta span{color:#667085}.timeline{display:grid;gap:13px;margin:23px 0}.step{display:flex;gap:11px;align-items:center;color:#667085;font-size:13px}.dot{width:10px;height:10px;border-radius:50%;background:#d5dce7;flex:none}.step.done{color:#182230;font-weight:700}.step.done .dot{background:#168bff;box-shadow:0 0 0 4px #168bff20}.note{background:#f7f8fa;border-radius:10px;padding:13px;font-size:12px;line-height:1.5;margin-top:15px}.foot{text-align:center;color:#98a2b3;font-size:11px;margin-top:22px}.error{text-align:center;color:#667085;padding:30px 5px}.hidden{display:none!important}
</style></head>
<body><main class="card"><div class="brand">E30 <span style="color:#168bff">·</span> i30</div><p class="eyebrow">SEGUIMIENTO DE REPARACIÓN</p><h1 class="title">Tu equipo, paso a paso.</h1><p class="sub">Consultá el estado actualizado de tu reparación.</p><div id="loading" class="sub">Buscando tu orden…</div><div id="content" class="hidden"><div id="status" class="status"></div><div class="meta"><span>Orden</span><b id="order"></b></div><div class="meta"><span>Equipo</span><b id="model"></b></div><div class="meta"><span>Recibido</span><b id="received"></b></div><div class="timeline" id="timeline"></div><div id="work" class="note hidden"></div><div id="warranty" class="note hidden"></div><div class="meta"><span>Última actualización</span><b id="updated"></b></div></div><div id="error" class="error hidden">No encontramos esta reparación. Verificá el QR de tu comprobante o comunicate con E30.</div><div class="foot">E30 · Servicio técnico</div></main>
<script>
(async()=>{const $=id=>document.getElementById(id);const token=new URLSearchParams(location.search).get("t");if(!token){$("loading").classList.add("hidden");$("error").classList.remove("hidden");return;}const client=window.supabase.createClient("https://zpuwfzdxyvltrtkikvsu.supabase.co","sb_publishable_F8lLX0s3FyLShFW2ceB9Tw_yyJRRZ5K");try{const {data,error}=await client.rpc("e30_consultar_seguimiento",{p_token:token});if(error||!data){throw error||new Error("not found");}const o=data;const states=["Recibido","Pendiente","Esperando repuesto","En reparación","Listo","Entregado"];const index=states.indexOf(o.estado);$("status").textContent=o.estado;$("order").textContent="#"+o.orden;$("model").textContent=o.modelo||"Equipo";$("received").textContent=o.recibido?new Date(o.recibido).toLocaleDateString("es-AR"):"—";$("updated").textContent=o.actualizado?new Date(o.actualizado).toLocaleString("es-AR"):"—";$("timeline").innerHTML=states.map((s,i)=>'<div class="step '+(index>=i?'done':'')+'"><i class="dot"></i><span>'+s+'</span></div>').join("");if(o.estado==="Cancelado"){$("timeline").innerHTML='<div class="step done"><i class="dot"></i><span>Reparación cancelada</span></div>';}if(o.trabajo_realizado){$("work").textContent="Trabajo realizado: "+o.trabajo_realizado;$("work").classList.remove("hidden");}if(o.garantia_dias!==null&&o.estado==="Entregado"){$("warranty").textContent=o.garantia_dias>0?"Garantía: "+o.garantia_dias+" días. "+(o.garantia_condiciones||"Conservá tu comprobante."):"Este trabajo no cuenta con garantía.";$("warranty").classList.remove("hidden");}$("loading").classList.add("hidden");$("content").classList.remove("hidden");}catch(e){$("loading").classList.add("hidden");$("error").classList.remove("hidden");}})();
</script></body></html>
